[package]
name = "are-news-controller-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "are_news_controller_core"

[dependencies]
base64 = "0.23.0"
hex = "0.4.3"
jsonschema = { version = "0.49.4", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.19"

[dev-dependencies]
httpmock = "0.8.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
