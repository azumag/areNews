[workspace]
members = ["core"]
# Deliberately no `default-members` override here: `tauri build`/`tauri dev`
# invoke plain `cargo build` from this directory with no `-p` flag, relying
# on Cargo's normal default of building the package in the current
# directory (this root package, which depends on `tauri` — required for
# features like `tauri/custom-protocol` to resolve). A `default-members`
# override changing that default broke real Windows builds even though it
# made local testing on this GTK-less machine more convenient — see the
# core crate testing instructions in README.md for the actual workaround
# (an explicit `-p`/`--manifest-path`, not a workspace-wide default change).

[package]
name = "are-news-controller"
version = "0.1.0"
edition = "2021"

[lib]
name = "are_news_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
are-news-controller-core = { path = "core" }
rodio = "0.19"
