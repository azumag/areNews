[workspace]
members = ["core"]
# `cargo test`/`cargo check` run from this directory with no `-p`/`--workspace`
# flag default to just the core crate: it's the only member buildable without
# the GTK/WebKit headers the shell package (this root package) needs on
# Linux. Use `cargo test -p are-news-controller` (or `--workspace`) to
# exercise the shell crate on a machine that has those headers.
default-members = ["core"]

[package]
name = "are-news-controller"
version = "0.1.0"
edition = "2021"

[lib]
name = "are_news_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
are-news-controller-core = { path = "core" }
base64 = "0.23.0"
