[workspace]
members = ["core"]

[package]
name = "are-news-controller"
version = "0.1.0"
edition = "2021"

[lib]
name = "are_news_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
are-news-controller-core = { path = "core" }
base64 = "0.23.0"
